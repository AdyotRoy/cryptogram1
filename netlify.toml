[build]
publish = "build/web"
command = "if [ -d flutter ]; then (cd flutter && git pull); else git clone https://github.com/flutter/flutter.git -b stable; fi && export PATH=\"$PATH:$(pwd)/flutter/bin\" && flutter config --enable-web && flutter build web --release"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200